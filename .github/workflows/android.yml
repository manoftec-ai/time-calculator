name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "25.2.9519653"
          ndk-type: "source"

      - name: Generate Gradle wrapper
        run: |
          curl -s "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          ln -sf /opt/gradle-8.2.1/bin/gradle /usr/local/bin/gradle
          gradle wrapper --gradle-version 8.2.1 --distribution-type all

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-calculator-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release bundle
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: time-calculator-release
          path: app/build/outputs/bundle/release/app-release.aab
