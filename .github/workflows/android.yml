name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip"
          unzip -q /tmp/gradle.zip -B -d $RUNNER_HOME
          echo "$RUNNER_HOME/gradle-8.2.1/bin" >> $GITHUB_PATH

      - name: Generate wrapper and build APK
        run: gradle wrapper --gradle-version 8.2.1 && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-calculator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: time-calculator-aab
          path: app/build/outputs/bundle/release/app-release.aab
